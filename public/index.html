<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CiKiZz - Generate Script Bot</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#05050f;color:#fff;font-family:'Space Grotesk',sans-serif}
.card{background:rgba(15,15,30,0.9);border:1px solid rgba(168,85,247,0.2);border-radius:18px;padding:18px;margin-bottom:14px}
label{font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}.plat{flex:1;min-width:110px;padding:12px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;font-weight:600;min-height:48px}
.plat.active{background:linear-gradient(135deg, rgba(6,182,212,0.3), rgba(168,85,247,0.3));border-color:#06b6d4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.feat{display:flex;align-items:center;gap:10px;padding:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:12px;font-size:11px;cursor:pointer}
.feat.active{border-color:#06b6d4;background:rgba(6,182,212,0.12)}input{width:100%;padding:12px;border-radius:10px;background:#000;border:1px solid #333;color:#fff;font-family:'JetBrains Mono',monospace}
.generate{width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(90deg,#06b6d4,#a855f7);color:#fff;font-weight:700;display:flex;justify-content:center;gap:8px;cursor:pointer}
.wa-preview{background:#111b21;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,0.1)}.wa-header{background:#202c33;padding:10px 14px;display:flex;gap:10px;align-items:center}
.bubble{background:#202c33;padding:10px;border-radius:8px 8px 8px 0;font-size:11px;font-family:'JetBrains Mono',monospace;white-space:pre-wrap}
.thumb-preview{width:100%;max-height:160px;object-fit:cover;border-radius:10px;margin-top:8px;display:none}
.upload-box{border:1.5px dashed rgba(168,85,247,0.4);border-radius:12px;padding:14px;text-align:center;margin-top:8px;background:rgba(168,85,247,0.05);cursor:pointer}
.container{display:grid;grid-template-columns:1.25fr 0.75fr;gap:16px;max-width:1450px;margin:0 auto;padding:12px}@media(max-width:900px){.container{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<div>
<div class="card">
<label><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="7" r="4"/><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/></svg> BOT IDENTITY</label>
<div class="row"><div style="flex:1"><input id="botName" placeholder="Nama Bot - ZetsuEge" oninput="updateAll()"></div><div style="flex:1"><input id="owner" placeholder="Owner - 62889..." oninput="updateAll()"></div></div>

<label><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00a884" stroke-width="1.5"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg> NOMOR BOT UNTUK PAIRING (WAJIB)</label>
<input id="pairingNumber" placeholder="62882000572938" oninput="updateAll()">

<label><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> BASE & KONEKSI</label>
<div class="row"><div class="plat active" data-base="esm" onclick="setBase('esm',this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> ESM Plugin</div><div class="plat" data-base="case" onclick="setBase('case',this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg> CASE</div></div>
<div class="row" style="margin-top:8px"><div class="plat active" data-conn="pairing" onclick="setConn('pairing',this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg> Pairing</div><div class="plat" data-conn="qr" onclick="setConn('qr',this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> QR</div></div>

<label><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-3.5-3.5-7 7"/></svg> THUMBNAIL IYA / TIDAK</label>
<div class="row"><div class="plat active" data-thumb="nothumb" onclick="setThumb('nothumb',this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg> Tanpa Thumbnail</div><div class="plat" data-thumb="thumb" onclick="setThumb('thumb',this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-3.5-3.5-7 7"/></svg> Pakai Thumbnail</div></div>
<div id="thumbUpload" style="display:none"><div class="upload-box" onclick="document.getElementById('thumbFile').click()"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><div style="font-size:11px;color:#9ca3af;margin-top:6px">Klik upload</div><input type="file" id="thumbFile" accept="image/*" style="display:none" onchange="previewThumb(this)"><img id="thumbPrev" class="thumb-preview"></div></div>

<label><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg> TAMPILAN MENU</label>
<div class="row"><div class="plat active" data-menu="premium" onclick="setMenu('premium',this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg> Premium Box</div><div class="plat" data-menu="simple" onclick="setMenu('simple',this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg> Simple</div><div class="plat" data-menu="image" onclick="setMenu('image',this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/></svg> Image</div></div>

<label><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00a884" stroke-width="1.5"><rect x="3" y="8" width="18" height="10" rx="2"/><path d="M7 8V6a5 5 0 0110 0v2"/></svg> GAYA TOMBOL</label>
<div class="row"><div class="plat active" data-btn="nobtn" onclick="setBtn('nobtn',this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/></svg> Teks Biasa</div><div class="plat" data-btn="btn" onclick="setBtn('btn',this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00a884" stroke-width="2"><rect x="3" y="8" width="18" height="10" rx="2"/><path d="M7 8V6a5 5 0 0110 0v2"/></svg> Button Beneran</div></div>

<label><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg> FITUR</label>
<div class="grid2" id="featGrid">
<div class="feat active" onclick="toggleFeat(this)"><input type="checkbox" value="welcome" checked> WELCOME</div>
<div class="feat active" onclick="toggleFeat(this)"><input type="checkbox" value="antilink" checked> ANTILINK</div>
<div class="feat active" onclick="toggleFeat(this)"><input type="checkbox" value="sticker" checked> STICKER</div>
<div class="feat active" onclick="toggleFeat(this)"><input type="checkbox" value="downloader" checked> DOWNLOADER</div>
<div class="feat active" onclick="toggleFeat(this)"><input type="checkbox" value="ai" checked> AI</div>
<div class="feat active" onclick="toggleFeat(this)"><input type="checkbox" value="group" checked> GROUP</div>
<div class="feat active" onclick="toggleFeat(this)"><input type="checkbox" value="rpg" checked> RPG</div>
<div class="feat active" onclick="toggleFeat(this)"><input type="checkbox" value="store" checked> STORE</div>
<div class="feat active" onclick="toggleFeat(this)"><input type="checkbox" value="autoreply" checked> AUTOREPLY</div>
<div class="feat active" onclick="toggleFeat(this)"><input type="checkbox" value="broadcast" checked> BROADCAST</div>
</div>

<button class="generate" id="genBtn" onclick="generateClient()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Generate ZIP (Link Stabil - No API)</button>
<div id="downloadLink" style="display:none;margin-top:12px;text-align:center"><a id="linkA" style="color:#06b6d4;font-weight:700" download>⬇️ Klik Download ZIP</a></div>
</div>
</div>

<div>
<div class="card">
<h3 style="font-size:12px;display:flex;align-items:center;gap:8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> PREVIEW</h3>
<div class="wa-preview" style="margin-top:10px"><div class="wa-header"><div style="width:28px;height:28px;background:linear-gradient(135deg,#a855f7,#06b6d4);border-radius:50%"></div><div><b id="prevName">Nama Bot</b><div style="font-size:10px;color:#8696a0" id="prevSub">Isi dulu</div></div></div><div style="padding:14px"><div class="bubble" id="waBubble">Isi BOT IDENTITY dulu...</div></div></div>
</div>
</div>
</div>

<script>
let state={base:'esm',conn:'pairing',menu:'premium',btn:'nobtn',thumb:'nothumb',thumbData:null};
function setBase(b,el){state.base=b; document.querySelectorAll('[data-base]').forEach(e=>e.classList.remove('active')); el.classList.add('active'); updateAll();}
function setConn(c,el){state.conn=c; document.querySelectorAll('[data-conn]').forEach(e=>e.classList.remove('active')); el.classList.add('active');}
function setMenu(m,el){state.menu=m; document.querySelectorAll('[data-menu]').forEach(e=>e.classList.remove('active')); el.classList.add('active'); updateAll();}
function setBtn(b,el){state.btn=b; document.querySelectorAll('[data-btn]').forEach(e=>e.classList.remove('active')); el.classList.add('active');}
function setThumb(t,el){state.thumb=t; document.querySelectorAll('[data-thumb]').forEach(e=>e.classList.remove('active')); el.classList.add('active'); document.getElementById('thumbUpload').style.display=t==='thumb'?'block':'none';}
function previewThumb(i){ const f=i.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>{ state.thumbData=e.target.result; document.getElementById('thumbPrev').src=e.target.result; document.getElementById('thumbPrev').style.display='block'; updateAll(); }; r.readAsDataURL(f); }
function toggleFeat(el){ const cb=el.querySelector('input'); cb.checked=!cb.checked; el.classList.toggle('active',cb.checked); updateAll(); }
function updateAll(){
  const raw=document.getElementById('botName').value.trim();
  const name=raw||'Nama Bot';
  document.getElementById('prevName').textContent=name;
  if(!raw){ document.getElementById('waBubble').textContent='Isi BOT IDENTITY dulu...'; document.getElementById('prevSub').textContent='Isi dulu'; return; }
  const feats=[...document.querySelectorAll('#featGrid input:checked')].map(i=>i.value);
  document.getElementById('prevSub').textContent=(state.menu==='premium'?'Premium Box':state.menu)+' • '+(state.btn==='btn'?'Button':'Teks');
  let txt=state.menu==='simple'?'MENU '+name+'\n'+feats.map(f=>'.'+f).join('\n'):'╭━━━〔 '+name+' 〕━━━\n'+feats.map(f=>'┃ • .'+f).join('\n')+'\n╰━━';
  document.getElementById('waBubble').textContent=txt+(state.thumb==='thumb'&&state.thumbData?' [Thumb]':'');
}

async function generateClient(){
  const botName=document.getElementById('botName').value.trim()||'Bot';
  const owner=document.getElementById('owner').value.trim();
  const pairing=document.getElementById('pairingNumber').value.trim().replace(/[^0-9]/g,'');
  if(!pairing) return alert('Isi Nomor Pairing WAJIB');
  const features=[...document.querySelectorAll('#featGrid input:checked')].map(i=>i.value);
  const safe=botName.replace(/[^a-zA-Z0-9-_]/g,'-');
  const zip=new JSZip();
  const feat=features.join(' ');
  let code=state.base==='case'
  ? '// '+botName+' CASE V16 FULL SVG+BUTTON+LINK\nconst { makeWASocket, useMultiFileAuthState, DisconnectReason } = require(\'noxleyss\');\nconst pino=require(\'pino\');\nlet rpgDB={}; let produkDB=[];\nasync function startBot(){\n  const { state, saveCreds } = await useMultiFileAuthState(\'sessions\');\n  const sock=makeWASocket({logger:pino({level:\'silent\'}), auth:state, printQRInTerminal:'+(state.conn==='qr')+'});\n  if(!sock.authState.creds.registered){ setTimeout(async()=>{ try{ let c=await sock.requestPairingCode(\''+pairing+'\'); console.log(\'PAIRING:\'+c.match(/.{1,4}/g).join(\'-\')); }catch(e){} },4000); }\n  sock.ev.on(\'creds.update\',saveCreds);\n  sock.ev.on(\'connection.update\',(u)=>{ if(u.connection===\'open\') console.log(\''+botName+' CONNECTED\'); });\n  sock.ev.on(\'messages.upsert\',async(o)=>{ const m=o.messages[0]; if(!m.message) return; const from=m.key.remoteJid; const body=m.message.conversation||\'\'; const cmd=body.startsWith(\'.\')?body.slice(1).split(\' \')[0]:\'\';\n    if(cmd===\'menu\') await sock.sendMessage(from,{text:\'MENU '+botName+' '+feat+'\'});\n  });\n}\nstartBot();'
  : '// '+botName+' ESM V16 FULL\nimport { makeWASocket, useMultiFileAuthState } from \'noxleyss\';\nimport pino from \'pino\';\nimport fs from \'fs\';\nimport path from \'path\';\nimport { fileURLToPath } from \'url\';\nconst __dirname=path.dirname(fileURLToPath(import.meta.url));\nasync function startBot(){ const { state, saveCreds } = await useMultiFileAuthState(\'sessions\'); const sock=makeWASocket({logger:pino({level:\'silent\'}), auth:state, printQRInTerminal:'+(state.conn==='qr')+'}); if(!sock.authState.creds.registered){ setTimeout(async()=>{ try{ let c=await sock.requestPairingCode(\''+pairing+'\'); console.log(c.match(/.{1,4}/g).join(\'-\')); }catch{} },4000); } sock.ev.on(\'creds.update\',saveCreds); console.log(\''+botName+' ready\'); }\nstartBot();';

  zip.file('index.js', code);
  zip.file('package.json', JSON.stringify({name:safe.toLowerCase(), version:'16.0.0', type: state.base==='esm'?'module':'commonjs', main:'index.js', dependencies:{noxleyss:'^1.2.1', pino:'^9.3.2'}}, null, 2));
  if(state.thumb==='thumb' && state.thumbData){ const p=state.thumbData.split(','); if(p[1]) zip.file('thumb.jpg', p[1], {base64:true}); }
  if(state.base==='esm'){ const pf=zip.folder('plugins'); pf.file('menu.js','export default async (m,sock)=>{ if((m.message?.conversation||\'\').trim()===\'.menu\') await sock.sendMessage(m.key.remoteJid,{text:\'MENU '+botName+' '+feat+'\'}); };'); features.forEach(f=>{ if(f!=='menu') pf.file(f+'.js','export default async (m,sock)=>{ const b=m.message?.conversation||\'\'; if(b.startsWith(\'.'+f+'\')) await sock.sendMessage(m.key.remoteJid,{text:\''+f+' OK\'}); };'); }); }
  
  const blob=await zip.generateAsync({type:'blob'});
  const url=URL.createObjectURL(blob);
  const a=document.getElementById('linkA');
  a.href=url; a.download=safe+'.zip'; a.textContent='⬇️ Download '+safe+'.zip - Klik Disini (Stabil Link)';
  document.getElementById('downloadLink').style.display='block';
  a.click();
}
updateAll();
</script>
</body>
</html>
