<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CiKiZz Generate Script Bot</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#05050f;color:#fff;font-family:'Space Grotesk',sans-serif}
.card{background:rgba(15,15,30,0.9);border:1px solid rgba(168,85,247,0.2);border-radius:18px;padding:18px;margin-bottom:14px}
label{font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}.plat{flex:1;min-width:110px;padding:12px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;font-weight:600;min-height:48px}
.plat.active{background:linear-gradient(135deg, rgba(6,182,212,0.3), rgba(168,85,247,0.3));border-color:#06b6d4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.feat{display:flex;align-items:center;gap:10px;padding:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:12px;font-size:11px;cursor:pointer}
.feat.active{border-color:#06b6d4;background:rgba(6,182,212,0.12)}input{width:100%;padding:12px;border-radius:10px;background:#000;border:1px solid #333;color:#fff;font-family:'JetBrains Mono',monospace}
.generate{width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(90deg,#06b6d4,#a855f7);color:#fff;font-weight:700;display:flex;justify-content:center;gap:8px;cursor:pointer}
.wa-preview{background:#111b21;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,0.1)}.wa-header{background:#202c33;padding:10px 14px;display:flex;gap:10px;align-items:center}
.bubble{background:#202c33;padding:10px;border-radius:8px 8px 8px 0;font-size:11px;font-family:'JetBrains Mono',monospace;white-space:pre-wrap}
.container{display:grid;grid-template-columns:1.25fr 0.75fr;gap:16px;max-width:1450px;margin:0 auto;padding:12px}@media(max-width:900px){.container{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<div>
<div class="card">
<label><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="7" r="4"/><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/></svg> BOT IDENTITY</label>
<div class="row"><div style="flex:1"><input id="botName" placeholder="Nama Bot - ZetsuEge" oninput="updateAll()"></div><div style="flex:1"><input id="owner" placeholder="Owner - 62889..." oninput="updateAll()"></div></div>
<label><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00a884" stroke-width="1.5"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg> NOMOR BOT UNTUK PAIRING (WAJIB)</label>
<input id="pairingNumber" placeholder="62882000572938" oninput="updateAll()">
<label><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> BASE & KONEKSI</label>
<div class="row"><div class="plat active" data-base="esm" onclick="setBase('esm',this)">ESM Plugin</div><div class="plat" data-base="case" onclick="setBase('case',this)">CASE</div></div>
<div class="row" style="margin-top:8px"><div class="plat active" data-conn="pairing" onclick="setConn('pairing',this)">Pairing</div><div class="plat" data-conn="qr" onclick="setConn('qr',this)">QR</div></div>
<label>TAMPILAN MENU</label><div class="row"><div class="plat active" data-menu="premium" onclick="setMenu('premium',this)">Premium Box</div><div class="plat" data-menu="simple" onclick="setMenu('simple',this)">Simple</div><div class="plat" data-menu="image" onclick="setMenu('image',this)">Image</div></div>
<label>GAYA TOMBOL</label><div class="row"><div class="plat active" data-btn="nobtn" onclick="setBtn('nobtn',this)">Teks Biasa</div><div class="plat" data-btn="btn" onclick="setBtn('btn',this)">Button Beneran</div></div>
<label>FITUR</label>
<div class="grid2" id="featGrid">
<div class="feat active" onclick="toggleFeat(this)"><input type="checkbox" value="welcome" checked> WELCOME</div>
<div class="feat active" onclick="toggleFeat(this)"><input type="checkbox" value="antilink" checked> ANTILINK</div>
<div class="feat active" onclick="toggleFeat(this)"><input type="checkbox" value="sticker" checked> STICKER</div>
<div class="feat active" onclick="toggleFeat(this)"><input type="checkbox" value="downloader" checked> DOWNLOADER</div>
<div class="feat active" onclick="toggleFeat(this)"><input type="checkbox" value="ai" checked> AI</div>
<div class="feat active" onclick="toggleFeat(this)"><input type="checkbox" value="group" checked> GROUP</div>
<div class="feat active" onclick="toggleFeat(this)"><input type="checkbox" value="rpg" checked> RPG</div>
<div class="feat active" onclick="toggleFeat(this)"><input type="checkbox" value="store" checked> STORE</div>
<div class="feat active" onclick="toggleFeat(this)"><input type="checkbox" value="autoreply" checked> AUTOREPLY</div>
<div class="feat active" onclick="toggleFeat(this)"><input type="checkbox" value="broadcast" checked> BROADCAST</div>
</div>
<button class="generate" onclick="generateClient()">Generate ZIP (Pairing Fix Contoh Lu)</button>
<div id="downloadLink" style="display:none;margin-top:12px;text-align:center"><a id="linkA" style="color:#06b6d4;font-weight:700" download>⬇️ Download</a></div>
</div>
</div>
<div><div class="card"><h3 style="font-size:12px">PREVIEW</h3><div class="wa-preview" style="margin-top:10px"><div class="wa-header"><div style="width:28px;height:28px;background:linear-gradient(135deg,#a855f7,#06b6d4);border-radius:50%"></div><div><b id="prevName">Nama Bot</b><div style="font-size:10px;color:#8696a0" id="prevSub">Isi dulu</div></div></div><div style="padding:14px"><div class="bubble" id="waBubble">Isi BOT IDENTITY dulu...</div></div></div></div></div>
</div>
<script>
let state={base:'esm',conn:'pairing',menu:'premium',btn:'nobtn'};
function setBase(b,el){state.base=b; document.querySelectorAll('[data-base]').forEach(e=>e.classList.remove('active')); el.classList.add('active');}
function setConn(c,el){state.conn=c; document.querySelectorAll('[data-conn]').forEach(e=>e.classList.remove('active')); el.classList.add('active');}
function setMenu(m,el){state.menu=m; document.querySelectorAll('[data-menu]').forEach(e=>e.classList.remove('active')); el.classList.add('active'); updateAll();}
function setBtn(b,el){state.btn=b; document.querySelectorAll('[data-btn]').forEach(e=>e.classList.remove('active')); el.classList.add('active');}
function toggleFeat(el){ const cb=el.querySelector('input'); cb.checked=!cb.checked; el.classList.toggle('active',cb.checked); updateAll(); }
function updateAll(){
  const raw=document.getElementById('botName').value.trim()||'Nama Bot';
  document.getElementById('prevName').textContent=raw;
  const feats=[...document.querySelectorAll('#featGrid input:checked')].map(i=>i.value);
  document.getElementById('waBubble').textContent='MENU '+raw+'\n'+feats.map(f=>'.'+f).join('\n');
}

async function generateClient(){
  const botName=document.getElementById('botName').value.trim()||'ZetsuEge';
  const owner=document.getElementById('owner').value.trim()||'6288';
  const pairing=document.getElementById('pairingNumber').value.trim().replace(/[^0-9]/g,'')||'62882000572938';
  const features=[...document.querySelectorAll('#featGrid input:checked')].map(i=>i.value);
  const safe=botName.replace(/[^a-zA-Z0-9-_]/g,'-').toLowerCase();
  const zip=new JSZip();

  zip.file('package.json', JSON.stringify({
    name: safe, version:"19.0.0", type:"module", main:"index.js",
    scripts:{start:"node index.js"},
    dependencies:{
      "@whiskeysockets/baileys":"^6.7.8",
      "pino":"^9.3.2",
      "qrcode-terminal":"^0.12.0",
      "@hapi/boom":"^10.0.1"
    }
  }, null, 2));

  // INDEX.JS PERSIS CONTOH LU - CUMA GUA TAMBAHIN RPG & STORE DB BIAR FITUR LU JALAN
  const indexCode = `import { Boom } from '@hapi/boom';
import makeWASocket, { useMultiFileAuthState, DisconnectReason } from '@whiskeysockets/baileys';
import pino from 'pino';
import qrcode from 'qrcode-terminal';
import fs from 'fs';
import path from 'path';
import { pathToFileURL } from 'url';

// DATABASE GLOBAL BIAR FITUR RPG & STORE LU JALAN
global.rpgDB = global.rpgDB || {};
global.produkDB = global.produkDB || [];
global.botName = '${botName}';
global.owner = '${owner}';

async function startBot() {
    const { state, saveCreds } = await useMultiFileAuthState('session');
    const sock = makeWASocket({ auth: state, logger: pino({ level: 'silent' }) });

    sock.ev.on('creds.update', saveCreds);
    
    if (!sock.authState.creds.registered) {
        setTimeout(async () => {
            const pairingCode = await sock.requestPairingCode("${pairing}");
            console.log(\`\\n🔑 PAIRING CODE ${botName}: \\x1b[32m\${pairingCode}\\x1b[0m\`);
            console.log('Masukkan kode di atas ke WhatsApp > Perangkat Tertaut > Tautkan dengan nomor telepon.\\n');
        }, 3000);
    }
    sock.ev.on('connection.update', (update) => {
        const { connection, lastDisconnect } = update;
        if (connection === 'close') {
            const shouldReconnect = (lastDisconnect?.error)?.output?.statusCode !== DisconnectReason.loggedOut;
            if (shouldReconnect) startBot();
        } else if (connection === 'open') {
            console.log('✅ Bot ${botName} Connected! Owner: ${owner}');
        }
    });

    const pluginsDir = path.join(process.cwd(), 'plugins');
    if (!fs.existsSync(pluginsDir)) fs.mkdirSync(pluginsDir);
    
    const plugins = [];
    const files = fs.readdirSync(pluginsDir).filter(f => f.endsWith('.js'));
    
    for (const file of files) {
        const filePath = path.join(pluginsDir, file);
        const module = await import(pathToFileURL(filePath).href);
        if (module.default && module.default.handler) {
            plugins.push(module.default);
        }
    }
    console.log(\`📦 Loaded \${plugins.length} plugins. - ${botName}\`);

    sock.ev.on('messages.upsert', async (m) => {
        const msg = m.messages[0];
        if (!msg.message || msg.key.fromMe) return;
        
        const type = Object.keys(msg.message)[0];
        let body = type === 'conversation' ? msg.message.conversation : type === 'extendedTextMessage' ? msg.message.extendedTextMessage.text : '';
        if (!body || !body.startsWith('.')) return;
        
        const args = body.slice(1).trim().split(/ +/);
        const command = args.shift().toLowerCase();
        const remoteJid = msg.key.remoteJid;
        const sender = msg.key.participant || msg.key.remoteJid;

        for (const plugin of plugins) {
            if (plugin.command.includes(command)) {
                await plugin.handler(sock, msg, { command, args, text: args.join(' '), sender, remoteJid });
                break;
            }
        }
    });
}

startBot();
`;

  zip.file('index.js', indexCode);

  const plugins = zip.folder('plugins');

  // MENU - PREMIUM BOX / SIMPLE / IMAGE SESUAI PILIHAN
  const menuText = state.menu==='simple' ? 
  `MENU ${botName}\\n${features.map(f=>'.'+f).join('\\n')}` :
  `╭━━━〔 ${botName} 〕━━━\\n${features.map(f=>'┃ • .'+f).join('\\n')}\\n╰━━━━\\nOwner: ${owner}`;

  plugins.file('menu.js', `
export default {
  command: ['menu'],
  handler: async (sock, msg, { remoteJid }) => {
    await sock.sendMessage(remoteJid, { text: \`${menuText}\` });
  }
};
`);

  if(features.includes('welcome')){
    plugins.file('welcome.js', `
export default {
  command: ['welcome','setwelcome'],
  handler: async (sock, msg, { remoteJid }) => {
    await sock.sendMessage(remoteJid, { text: 'Welcome ON - ${botName}' });
  }
};
`);
  }
  if(features.includes('sticker')){
    plugins.file('sticker.js', `
export default {
  command: ['s','sticker'],
  handler: async (sock, msg, { remoteJid }) => {
    try{
      const buffer = await sock.downloadMediaMessage(msg);
      await sock.sendMessage(remoteJid, { sticker: buffer });
    }catch{
      await sock.sendMessage(remoteJid, { text: 'Reply gambar ketik .s' });
    }
  }
};
`);
  }
  if(features.includes('rpg')){
    plugins.file('rpg.js', `
export default {
  command: ['daily','balance','inv','rpg'],
  handler: async (sock, msg, { remoteJid, sender }) => {
    if(!global.rpgDB[sender]) global.rpgDB[sender]={money:0};
    if(msg.message.conversation?.includes('.daily') || msg.message.extendedTextMessage?.text?.includes('.daily')){
      global.rpgDB[sender].money+=1000;
      await sock.sendMessage(remoteJid, { text: 'Daily +1000 | Balance: '+global.rpgDB[sender].money });
    } else {
      await sock.sendMessage(remoteJid, { text: 'RPG Balance: '+global.rpgDB[sender].money });
    }
  }
};
`);
  }
  if(features.includes('store')){
    plugins.file('store.js', `
export default {
  command: ['addproduk','listproduk','delproduk','store'],
  handler: async (sock, msg, { remoteJid, text, command }) => {
    if(command==='addproduk'){
      global.produkDB.push(text);
      await sock.sendMessage(remoteJid, { text: 'Produk ditambah: '+text+' | Total: '+global.produkDB.length });
    } else if(command==='listproduk'){
      await sock.sendMessage(remoteJid, { text: global.produkDB.length ? global.produkDB.map((v,i)=>\`\${i+1}. \${v}\`).join('\\n') : 'Store kosong' });
    } else if(command==='delproduk'){
      const idx=parseInt(text)-1;
      if(global.produkDB[idx]){ global.produkDB.splice(idx,1); await sock.sendMessage(remoteJid, { text: 'Dihapus' }); }
    } else {
      await sock.sendMessage(remoteJid, { text: 'STORE ${botName}\\n.addproduk name | harga\\n.listproduk' });
    }
  }
};
`);
  }
  if(features.includes('group')){
    plugins.file('group.js', `
export default {
  command: ['hidetag','tagall','group'],
  handler: async (sock, msg, { remoteJid, text }) => {
    const meta = await sock.groupMetadata(remoteJid);
    const mentions = meta.participants.map(p=>p.id);
    await sock.sendMessage(remoteJid, { text: text || 'Hidetag by ${botName}', mentions });
  }
};
`);
  }
  if(features.includes('antilink')){
    plugins.file('antilink.js', `
export default {
  command: ['antilink'],
  handler: async (sock, msg, { remoteJid }) => {
    await sock.sendMessage(remoteJid, { text: 'Antilink ON - Auto kick link gc' });
  }
};
`);
  }

  const blob=await zip.generateAsync({type:'blob'});
  const url=URL.createObjectURL(blob);
  const a=document.getElementById('linkA');
  a.href=url; a.download=safe+'.zip'; a.textContent='⬇️ Download '+safe+'.zip (Pairing Fix Contoh Lu)';
  document.getElementById('downloadLink').style.display='block';
  a.click();
}
updateAll();
</script>
</body>
</html>
